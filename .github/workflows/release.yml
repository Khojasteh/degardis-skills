name: Release skill bundles

"on":
  workflow_dispatch:
    inputs:
      tag:
        description: Dated snapshot tag, for example skills-2026-07-28
        required: true
        type: string
      hold:
        description: >-
          Space-separated skills whose changed source this snapshot deliberately
          does not publish. A changed skill that is neither released nor held
          fails the run.
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-skill-bundles
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: Check release tag
      env:
        GH_TOKEN: ${{ github.token }}
        RELEASE_TAG: ${{ inputs.tag }}
      run: |
        if [[ ! "$RELEASE_TAG" =~ ^skills-[0-9]{4}-[0-9]{2}-[0-9]{2}(\.[1-9][0-9]*)?$ ]]; then
          echo "::error::Tag must use skills-YYYY-MM-DD or skills-YYYY-MM-DD.N."
          exit 1
        fi
        if git rev-parse -q --verify "refs/tags/$RELEASE_TAG" > /dev/null; then
          echo "::error::Tag $RELEASE_TAG already exists."
          exit 1
        fi
        if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
          echo "::error::Release $RELEASE_TAG already exists."
          exit 1
        fi
    - uses: actions/setup-python@v7
      with:
        python-version: "3.14"
    - name: Install Degardis
      run: python -m pip install "degardis>=2"
    - name: Check documentation
      run: python .github/scripts/check-docs.py
    - name: Validate skill sources
      run: degardis validate skills
    - name: Generate release notes
      env:
        RELEASE_TAG: ${{ inputs.tag }}
        HOLD: ${{ inputs.hold }}
      run: |
        held=""
        for name in $HOLD; do
          held="$held --hold $name"
        done
        python .github/scripts/generate-release-notes.py \
          --output .artifacts/release-notes.md \
          --released-skills .artifacts/released-skills.txt \
          --published-skills .artifacts/published-skills.txt \
          $held
    - name: Build released skill bundles
      run: |
        mkdir -p .artifacts/bundles
        while read -r name; do
          [ -n "$name" ] || continue
          degardis build "skills/$name" --zip --output .artifacts/built
        done < .artifacts/released-skills.txt
    - name: Carry forward previously published bundles
      env:
        GH_TOKEN: ${{ github.token }}
        RELEASE_TAG: ${{ inputs.tag }}
      run: |
        previous="$(git tag --merged HEAD --list 'skills-*' --sort=-version:refname \
          | grep -v "^${RELEASE_TAG}$" | head -n 1)"
        if [ -n "$previous" ]; then
          echo "Carrying forward bundles published in $previous."
          gh release download "$previous" --pattern '*.zip' --dir .artifacts/carried
          for bundle in .artifacts/carried/*.zip; do
            [ -e "$bundle" ] || continue
            name="$(basename "$bundle" .zip)"
            if grep -qx "$name" .artifacts/published-skills.txt; then
              cp "$bundle" .artifacts/bundles/
            else
              echo "Dropping $name.zip: no longer a published skill (retired)."
            fi
          done
        fi
        cp .artifacts/built/*.zip .artifacts/bundles/
    - name: Check the attached asset set is complete
      run: |
        status=0
        while read -r name; do
          [ -n "$name" ] || continue
          if [ ! -f ".artifacts/bundles/$name.zip" ]; then
            echo "::error::No bundle available for released skill $name."
            status=1
          fi
        done < .artifacts/published-skills.txt
        for bundle in .artifacts/bundles/*.zip; do
          name="$(basename "$bundle" .zip)"
          if ! grep -qx "$name" .artifacts/published-skills.txt; then
            echo "::error::Bundle $name.zip has no released version to publish."
            status=1
          fi
        done
        exit "$status"
    - name: Publish latest snapshot
      env:
        GH_TOKEN: ${{ github.token }}
        RELEASE_TAG: ${{ inputs.tag }}
      run: |
        snapshot="${RELEASE_TAG#skills-}"
        gh release create "$RELEASE_TAG" .artifacts/bundles/*.zip \
          --target "$GITHUB_SHA" \
          --title "Downloadable skill bundles — $snapshot" \
          --notes-file .artifacts/release-notes.md \
          --latest
