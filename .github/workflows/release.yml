name: Release skill bundles

"on":
  workflow_dispatch:
    inputs:
      tag:
        description: Dated snapshot tag, for example skills-2026-07-28
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-skill-bundles
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: Check release tag
      env:
        RELEASE_TAG: ${{ inputs.tag }}
      run: |
        if [[ ! "$RELEASE_TAG" =~ ^skills-[0-9]{4}-[0-9]{2}-[0-9]{2}(\.[1-9][0-9]*)?$ ]]; then
          echo "::error::Tag must use skills-YYYY-MM-DD or skills-YYYY-MM-DD.N."
          exit 1
        fi
    - uses: actions/setup-python@v7
      with:
        python-version: "3.14"
    - name: Install Degardis
      run: python -m pip install degardis
    - name: Check generated README content
      run: python .github/scripts/generate-readmes.py --check
    - name: Validate skill sources
      run: degardis validate skills
    - name: Build all skill profiles
      run: degardis build skills --profile all --zip --output .artifacts
    - name: Generate release notes
      env:
        RELEASE_TAG: ${{ inputs.tag }}
      run: >-
        python .github/scripts/generate-release-notes.py
        --output .artifacts/release-notes.md
    - name: Publish latest snapshot
      env:
        GH_TOKEN: ${{ github.token }}
        RELEASE_TAG: ${{ inputs.tag }}
      run: |
        snapshot="${RELEASE_TAG#skills-}"
        gh release create "$RELEASE_TAG" .artifacts/*.zip \
          --target "$GITHUB_SHA" \
          --title "Downloadable skill bundles — $snapshot" \
          --notes-file .artifacts/release-notes.md \
          --latest
