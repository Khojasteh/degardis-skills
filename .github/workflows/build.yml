name: Validate

"on":
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: "3.14"
    - name: Install Degardis
      run: python -m pip install "degardis>=2"
    - name: Build all skills
      run: degardis build skills --zip --output .artifacts
